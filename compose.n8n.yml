services:
  n8n:
    build:
      context: .
      dockerfile: Dockerfile.n8n
    image: codex-test-n8n-with-ffmpeg:2.29.10
    container_name: n8n
    restart: unless-stopped
    ports:
      - "127.0.0.1:5678:5678"
    environment:
      - TZ=${TZ:-Europe/Copenhagen}
      - GENERIC_TIMEZONE=${GENERIC_TIMEZONE:-Europe/Copenhagen}
      - N8N_HOST=localhost
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - N8N_RESTRICT_FILE_ACCESS_TO=/files;/home/node/.n8n
      - N8N_BINARY_DATA_MODE=filesystem
      - NODE_FUNCTION_ALLOW_BUILTIN=child_process,fs,path
      - N8N_AI_ASSISTANT_BASE_URL=https://ai-assistant.n8n.io
    volumes:
      - n8n_data:/home/node/.n8n
      - ./output:/files

volumes:
  n8n_data:
    name: n8n_n8n_data
