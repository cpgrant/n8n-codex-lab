[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ai-strategy-factory"
version = "0.1.0"
description = "Lightweight local agent service for the n8n Codex AI Factory Lab"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
dependencies = [
  "alembic>=1.16,<2",
  "fastapi>=0.115,<1",
  "psycopg[binary]>=3.2,<4",
  "sqlalchemy>=2.0,<3",
  "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.27,<1",
  "pytest>=8,<9",
]

[tool.hatch.build.targets.wheel]
packages = ["src/ai_factory"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
